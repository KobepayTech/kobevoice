services:
  kobevoice:
    build: .
    container_name: kobevoice
    restart: unless-stopped

    ports:
      # Host-side moved to 17600 so the dev/installed Kobevoice can keep 17493.
      # Container still listens on its native port internally.
      - "127.0.0.1:17600:17493"

    volumes:
      # Bind-mount for generated audio (customize the host path as needed)
      # Host side:      ./output/
      # Container side: /app/data/generations/
      - ./output:/app/data/generations

      # Named volume for profiles, DB, cache (persists across container restarts)
      - kobevoice-data:/app/data

      # HuggingFace model cache (so models aren't re-downloaded on rebuild)
      - huggingface-cache:/home/kobevoice/.cache/huggingface

    environment:
      - LOG_LEVEL=info
      - NUMBA_CACHE_DIR=/tmp/numba_cache

    networks:
      - kobevoice-net

    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

networks:
  kobevoice-net:
    driver: bridge

volumes:
  kobevoice-data:
  huggingface-cache:
