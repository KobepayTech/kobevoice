name: Kobe Voice MVP CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile backend/main.py backend/game.py backend/arena.py backend/rap_arena.py backend/rap_box.py
      - name: Import applications
        run: python -c "from backend.main import app as business_app; from backend.game import app as quest_app; from backend.arena import app as arena_app; from backend.rap_box import app as rap_box_app; print(business_app.title, quest_app.title, arena_app.title, rap_box_app.title)"
      - name: Validate browser scripts
        run: node -e "for (const f of ['frontend/index.html','game_frontend/index.html','arena_frontend/index.html','rap_frontend/index.html']) { const s=require('fs').readFileSync(f,'utf8').match(/<script>([\\s\\S]*?)<\\/script>/)[1]; new Function(s); console.log(f); }"
