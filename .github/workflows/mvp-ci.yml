name: Kobe Voice MVP CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile backend/main.py backend/game.py
      - name: Import applications
        run: python -c "from backend.main import app as business_app; from backend.game import app as game_app; print(business_app.title, game_app.title)"
