[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-starter-python"
version = "1.0.0"
description = "Simple voice AI assistant built with LiveKit Agents for Python"
requires-python = ">=3.10, <3.15"

dependencies = [
    "livekit-agents>=1.6.9",
    "livekit-plugins-ai-coustics~=0.2",
    "python-dotenv",
]

[project.optional-dependencies]
# Self-hosted Chatterbox TTS. Kept optional because it pulls torch (~2GB) and
# needs a GPU in practice — see the RTF measurements in the README.
chatterbox = [
    "chatterbox-tts>=0.1.7",
    "numpy",
    # perth (Chatterbox's watermarker) imports pkg_resources, which setuptools
    # removed in 81. Without this pin the model fails to load with a confusing
    # "'NoneType' object is not callable".
    "setuptools<81",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
# yarl 1.24.1 was published with only a cp310 wheel and no sdist, so it can't
# install on Python 3.11+. Remove this once upstream uploads the remaining wheels.
constraint-dependencies = ["yarl<1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
